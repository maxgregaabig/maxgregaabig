<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Max Regan — dependable AI, from model to production</title>
  <desc id="desc">A navy banner with a mint accent and a small diagram connecting retrieval, state, tools, and evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1626"/>
      <stop offset="1" stop-color="#122a3a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b7d4e5" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <rect x="42" y="39" width="4" height="180" rx="2" fill="#63e5c3"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="68" y="66" font-size="14" font-weight="600" letter-spacing="3" fill="#83e8cc">MAX REGAN / AI SYSTEMS</text>
    <text x="66" y="127" font-size="43" font-weight="700" letter-spacing="-1.3" fill="#f4f8fb">Dependable AI.</text>
    <text x="66" y="176" font-size="35" font-weight="400" letter-spacing="-.7" fill="#d2dfe9">From model to production.</text>
    <text x="68" y="218" font-size="14" letter-spacing="1.4" fill="#95acbd">AGENT EXECUTION · RETRIEVAL · INFERENCE</text>
  </g>
  <g fill="none" stroke="#4b7285" stroke-width="1.5">
    <path d="M750 93H811M923 93H993M1047 120V181H689V122"/>
    <path d="m803 89 8 4-8 4m174-8 8 4-8 4M685 130l4-8 4 8"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g>
