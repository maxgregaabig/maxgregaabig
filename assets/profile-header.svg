      <text x="695" y="99" font-size="15" fill="#d9e6ee">Retrieve</text>
    </g>
    <g>
      <rect x="813" y="66" width="110" height="54" rx="10" fill="#163b3d" stroke="#63e5c3"/>
      <text x="868" y="99" font-size="15" font-weight="600" fill="#97f0d8">Checkpoint</text>
    </g>
    <g>
